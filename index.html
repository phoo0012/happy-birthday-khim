<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สุขสันต์วันเกิดขิม 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#a9dcf5;--bg2:#8dceef;--ink:#164765;--card:#ffffff;--ac:#309ed4;--pink:#ff9fc8;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#a9dcf5;--bg2:#8dceef;--ink:#164765;--card:#ffffff}}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{font-family:Mali,'Sarabun','Noto Sans Thai',sans-serif;background:linear-gradient(180deg,#8dceef 0%,#a9dcf5 55%,#d8f1fc 100%);color:#164765;overflow:hidden;text-align:center;user-select:none}
.s{display:none;position:absolute;inset:0;padding:20px;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto}
.s.on{display:flex;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(1.45rem,6vw,2rem);margin:0}p{margin:0;line-height:1.7;max-width:520px}
.big{font-size:110px;cursor:pointer;animation:bob 1.6s infinite}@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.b{font:inherit;font-size:1.05rem;padding:12px 26px;border:0;border-radius:99px;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 4px 0 #237cab}.b:active{transform:translateY(3px);box-shadow:none}.b.pk{background:var(--pink);box-shadow:0 4px 0 #d9608e}
[hidden]{display:none!important}.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 20px #0002}
#cnt{font-size:9rem;font-weight:600;color:var(--ac)}#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:10;font-size:22px;background:var(--card);border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
.profile{width:min(76vw,250px);height:min(76vw,250px);object-fit:cover;border-radius:50%;border:8px solid #fff;box-shadow:0 8px 25px #398bc855}
.gallery{display:flex;gap:10px;max-width:95vw;overflow-x:auto;padding:6px}.gallery img{width:92px;height:112px;object-fit:cover;border-radius:14px;border:4px solid #fff;box-shadow:0 3px 10px #0002;flex:none}
.music-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(94vw,700px);align-items:stretch}.music-choice{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#ffffffee;border:4px solid #fff;border-radius:24px;padding:18px;color:#164765;box-shadow:0 7px 0 #6db7d855,0 8px 20px #16476522;cursor:pointer;font:inherit;transition:transform .12s,box-shadow .12s}.music-choice:hover{transform:translateY(-3px)}.music-icon{font-size:2.5rem}.music-choice strong{display:block;font-size:1.1rem}.music-choice small{display:block;color:#47758d;margin-top:3px}@media(max-width:560px){.music-list{grid-template-columns:1fr}.music-choice{min-height:105px;flex-direction:row;text-align:left;justify-content:flex-start}}#area{position:absolute;inset:0;width:100vw;height:100vh;max-width:none;min-height:0;overflow:hidden;border-radius:0;background:#ffffff12;border:0;box-shadow:none;z-index:1}.bl{position:absolute;bottom:-140px;width:96px;height:118px;border-radius:50% 50% 46% 46%;font-size:0;cursor:pointer;z-index:3;transition:bottom 8s linear;box-shadow:inset -10px -12px 16px #17476533,inset 8px 8px 10px #ffffff88,0 8px 12px #17476522}.bl::after{content:'';position:absolute;left:50%;bottom:-36px;width:3px;height:38px;background:#2389d2;transform:rotate(5deg);transform-origin:top}.bl img{width:66px;height:66px;object-fit:cover;border-radius:50%;position:absolute;left:15px;top:16px;border:3px solid #fff;box-shadow:0 2px 5px #0003}.bl b{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);font-size:26px;color:#2389d2}.wish-board{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vw,460px);min-height:135px;padding:24px 20px;display:flex;align-items:center;justify-content:center;background:#fffdf5ee;border:5px solid #fff;border-radius:28px;box-shadow:0 8px 0 #86c8e855,0 8px 25px #17476533;color:#164765;font-size:1.2rem;font-weight:600}.wish-board::before{content:'✦  คำอวยพร  ✦';position:absolute;top:-18px;left:50%;transform:translateX(-50%);padding:3px 15px;background:#ffafd0;border:3px solid #fff;border-radius:99px;color:#fff;font-size:.9rem;white-space:nowrap}.s>h1,.s>#bm{position:relative;z-index:6}#n4{position:absolute;z-index:10;left:50%;top:calc(50% + 125px);transform:translateX(-50%);white-space:nowrap}#n4:active{transform:translateX(-50%) translateY(3px)}
.cd{display:flex;gap:26px;font-size:56px;margin:0}.cd span{cursor:pointer;position:relative}.fl{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:34px;animation:fk .4s infinite alternate}@keyframes fk{to{transform:translateX(-50%) scale(1.15) rotate(6deg)}}
#sc{position:relative;width:280px;height:140px;border-radius:16px;overflow:hidden}#sc .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff7d6;color:#7a4b00;font-weight:600}#sc canvas{position:absolute;inset:0;touch-action:none}
.rain{position:fixed;top:-40px;z-index:8;font-size:30px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.4)}}
</style>
</head>
<body>
<canvas id="cf"></canvas><button id="mus" aria-label="เสียง">🔊</button>
<section class="s on"><img class="profile" src="ดาวน์โหลด.jpeg" alt="รูปขิม"><div class="big" id="gift">🎁</div><h1>ถึงเวลาเปิดกล่องแล้วววจ้าาา</h1><p>แตะกล่องเพื่อเลือกเพลงก่อนเปิดดู 🐱</p></section>
<section class="s"><h1>เลือกเพลงก่อนเปิดนะ 🎵</h1><p>เพลงจะเริ่มเล่นจากช่วงที่แนะนำให้ฟัง</p><div class="music-list"><button class="music-choice" data-file="music/กันตรึมสกา ยิ่งยง ยอดบัวงาม MUSIC VIDEO.mp3" data-start="54"><span class="music-icon">🎶</span><span><strong>กันตรึมสกา</strong></span></button><button class="music-choice" data-file="music/Lizzy McAlpine Staying Official Audio.mp3" data-start="56"><span class="music-icon">🎧</span><span><strong>staying (ยุทธการแนะนำ)</strong></span></button></div></section>
<section class="s"><div id="cnt">3</div></section>
<section class="s"><h1 id="tt">🎂</h1><div class="card"><p id="msg" style="min-height:140px;text-align:left"></p></div><button class="b" id="n2" hidden>ไปต่อ ›</button></section>
<section class="s"><h1>ขอพรแล้วเป่าเทียนเลย 🕯️</h1><p>แตะเปลวไฟเพื่อเป่าให้ดับ</p><div class="cd" id="cd"></div><div style="font-size:96px;margin-top:-18px">🎂</div><p id="cm"></p><button class="b" id="n3" hidden>ไปต่อ ›</button></section>
<section class="s"><div id="area"><div class="wish-board" id="wishBoard"></div></div><button class="b" id="n4" hidden>ไปต่อ ›</button></section>
<section class="s"><h1>การ์ดขูดพิเศษ ✨</h1><p>ใช้นิ้วขูดดูเลย</p><div id="sc"><div class="under">🎟️ คูปองกอดฟรี 1 ครั้ง<br>+ ขอพรเพิ่มได้ 1 ข้อ 🐱</div><canvas width="280" height="140"></canvas></div><button class="b" id="n5" hidden>ไปต่อ ›</button></section>
<section class="s"><h1>ถึงขิม 💌</h1><div class="card"><p id="lt" style="text-align:left"></p></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="b pk" id="hug">ส่งกอดกลับ 🤗</button><button class="b" id="again">เล่นอีกรอบ</button></div><p id="hm"></p></section>
<script>
const C={name:'ขิม',age:20,from:'คนที่คิดถึงเธอเสมอ',msg:'สุขสันต์วันเกิดขอให้มีความสุขมากก ก.ไก่ 5ร้อยตัวเลย\nขอให้ปีนี้ได้ทำสิ่งที่ตัวเองชอบเยอะๆ เจอแต่ผู้คนดีๆ\nยิ้มได้ทุกๆวัน สอบผ่านทุกวิชา\nขอให้แมวกับหมาที่เจอมาให้ลูบหัวให้หมดเลย\nขอให้ได้กินของอร่อยเยอะๆ ขอให้ไม่มีเรื่องเครียด\nสุดท้ายขอให้มีความสุข....',wishes:['โคตรโหด 🔥','โคตรเก่ง 💙','คนเก่ง ✨','ยกให้เป็นรุ่นใหญ่ 👑','คนสวย 💐','น่ารักที่สุด 🐱','no1เลย 🏆'],fortunes:['ปีนี้จะมีสัตว์น่ารักเดินเข้ามาทักทายเธอ 🐶🐱','สีฟ้าคือสีนำโชคของเธอ 💙','จะได้กินของอร่อยโดยไม่คาดคิด 🍜','มีเรื่องดีๆ รอเธออยู่ใกล้ๆ นี่เอง','เธอจะหัวเราะมากขึ้นกว่าเดิม 3 เท่า','ใครสักคนกำลังคิดถึงเธออยู่นะ 💭'],letter:'ถึงขิม\n\nผ่านไปอีกปีจริงๆ คิดว่าปีนี้ก็แปลกอยู่เหมือนกันนะ เมื่อปีที่แล้วเราคุยกันเยอะมากกก เป็นหนึ่งในช่วงเวลาที่ชอบมากเลย\nแต่ปีนี้ไม่รู้เหมือนกันทำไมไม่ได้คุยกัน แต่ช่างเถอะ\n\nขอให้เจอแต่สิ่งดีๆ ยิ้มกับเรื่องง่ายๆ ได้ทุกวัน ขอให้มีความสุขมากกกๆๆๆ\nพรข้อไหนเจ๋งๆ ยกให้หมดเลย สาธุๆๆๆๆ'};
const $=id=>document.getElementById(id),S=[...document.querySelectorAll('.s')];let ac,on=true,bt;const cv=$('cf'),cx=cv.getContext('2d'),P=[];let run=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function boom(n=120){for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,c:`hsl(${Math.random()*360},85%,60%)`,s:6+Math.random()*6,r:Math.random()*6,l:150});if(!run)loop()}
function loop(){run=1;cx.clearRect(0,0,cv.width,cv.height);for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.r+=.2;p.l--;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();if(p.l<=0)P.splice(i,1)}P.length?requestAnimationFrame(loop):(run=0,cx.clearRect(0,0,cv.width,cv.height))}
function tone(f,t=0,d=.25,ty='sine',v=.15){if(!ac||!on)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}
const pop=()=>tone(700,0,.12,'triangle'),ding=()=>{tone(880,0,.3);tone(1320,.1,.4)};
function song(){[262,262,294,262,349,330,262,262,294,262,392,349,262,262,523,440,349,330,294,466,466,440,349,392,349].forEach((f,i)=>tone(f,i*.22,.18,'triangle',.12))}
$('mus').onclick=()=>{on=!on;$('mus').textContent=on?'🔊':'🔇'};
function rain(e,n=18){for(let i=0;i<n;i++){const r=document.createElement('div');r.className='rain';r.textContent=e;r.style.left=Math.random()*95+'%';r.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(r);setTimeout(()=>r.remove(),4500)}}
function type(el,t,cb){el.textContent='';let i=0;const k=setInterval(()=>{if(i<t.length){el.textContent+=t[i++]}else{clearInterval(k);cb&&cb()}},35)}
function go(n){S.forEach((e,i)=>e.classList.toggle('on',i===n));clearInterval(bt);if(n===2){cnt();return}[start,music,null,msg,cake,balloons,scratch,letter][n]?.()}
function start(){}
function music(){}
$('gift').onclick=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();$('gift').textContent='🎉';ding();setTimeout(()=>go(1),500)};
let countTimer=null;function cnt(){clearInterval(countTimer);let n=3;$('cnt').textContent=n;countTimer=setInterval(()=>{n--;if(n>0){$('cnt').textContent=n;tone(400+n*100,0,.2)}else{clearInterval(countTimer);countTimer=null;$('cnt').textContent='🎉';boom(200);ding();setTimeout(()=>go(3),1500)}},900)}
function msg(){$('tt').textContent=`สุขสันต์วันเกิด${C.name} 🎂`;$('n2').hidden=true;type($('msg'),C.msg,()=>$('n2').hidden=false)}
function cake(){const cd=$('cd');cd.innerHTML='';$('cm').textContent='';$('n3').hidden=true;let left=3;for(let i=0;i<3;i++){const s=document.createElement('span');s.innerHTML='<i class="fl" style="font-style:normal">🔥</i>🕯️';s.onclick=()=>{if(s.dataset.o)return;s.dataset.o=1;s.querySelector('.fl').remove();tone(200,0,.2,'sawtooth',.06);if(--left===0){boom(150);ding();$('cm').textContent='อธิษฐานแล้วใช่มั้ย? 🤭';$('n3').hidden=false}};cd.appendChild(s)}}
function balloons(){const a=$('area'),board=$('wishBoard');a.querySelectorAll('.bl').forEach(b=>b.remove());$('n4').hidden=true;board.textContent='';board.classList.remove('has-message');let shown=0,remaining=[...C.wishes],pics=['images/images.jpeg','images/images (1).jpeg','images/images (2).jpeg','images/images (3).jpeg','images/images (4).jpeg','images/images (5).jpeg'];const spawn=()=>{const b=document.createElement('div');b.className='bl';const im=document.createElement('img');im.src=pics[Math.floor(Math.random()*pics.length)];im.alt='รูปสัตว์น่ารัก';b.appendChild(im);const mark=document.createElement('b');mark.textContent='♡';b.appendChild(mark);let left,top;do{left=2+Math.random()*92;top=5+Math.random()*82}while(left>25&&left<75&&top>30&&top<70);b.style.left=left+'%';b.style.top=top+'%';b.style.bottom='auto';a.appendChild(b);b.animate([{transform:'translateY(105vh)'},{transform:'translateY(-125vh)'}],{duration:9000+Math.random()*5000,easing:'linear'}).onfinish=()=>b.remove();b.onclick=()=>{if(b.dataset.p)return;b.dataset.p=1;b.getAnimations().forEach(animation=>animation.cancel());b.style.transform='scale(0)';pop();const index=Math.floor(Math.random()*remaining.length);board.textContent=remaining.splice(index,1)[0];board.classList.add('has-message');shown++;if(!remaining.length){$('n4').hidden=false;remaining=[...C.wishes];shown=0;boom(100);ding()}setTimeout(()=>b.remove(),220)};};for(let i=0;i<18;i++)setTimeout(spawn,i*170);bt=setInterval(spawn,520)}
function scratch(){const c=document.querySelector('#sc canvas'),x=c.getContext('2d');$('n5').hidden=true;c.style.display='block';x.globalCompositeOperation='source-over';x.fillStyle='#b8c4d0';x.fillRect(0,0,280,140);x.fillStyle='#526f87';x.font='20px sans-serif';x.textAlign='center';x.fillText('✨ ขูดตรงนี้ ✨',140,76);let d=0,k=0;const sc=e=>{if(!d)return;const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*280/r.width,py=(e.clientY-r.top)*140/r.height;x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,18,0,7);x.fill();if(++k%8===0){const D=x.getImageData(0,0,280,140).data;let t=0;for(let i=3;i<D.length;i+=64)if(!D[i])t++;if(t/(D.length/64)>.45){c.style.display='none';boom(150);ding();$('n5').hidden=false}}};c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);sc(e)};c.onpointermove=sc;c.onpointerup=()=>d=0}
function fort(){$('fo').textContent='แตะคุกกี้เพื่อเปิดคำทำนาย';$('n6').hidden=true;$('ck').textContent='🥠';$('ck').onclick=()=>{$('ck').textContent='✨';ding();$('fo').textContent=C.fortunes[Math.floor(Math.random()*C.fortunes.length)];$('n6').hidden=false;setTimeout(()=>$('ck').textContent='🥠',700)}}
function letter(){$('hm').textContent='';type($('lt'),C.letter)}
window.musicPlayer=null;document.querySelectorAll('.music-choice').forEach(button=>button.onclick=()=>{if(window.musicPlayer)window.musicPlayer.pause();const player=new Audio(encodeURI(button.dataset.file));window.musicPlayer=player;player.preload='auto';player.volume=.85;const startAt=Number(button.dataset.start);const beginAtTime=()=>{if(player.readyState>=1){player.currentTime=startAt;player.play().catch(()=>{});setTimeout(()=>{if(Math.abs(player.currentTime-startAt)>1){player.currentTime=startAt}},150)}};player.addEventListener('loadedmetadata',beginAtTime,{once:true});player.addEventListener('canplay',beginAtTime,{once:true});player.load();go(2)});['n2','n3','n4','n5'].forEach((id,i)=>$(id).onclick=()=>go(i+4));$('hug').onclick=()=>{rain('💙',26);rain('🐱',8);boom(120);ding();$('hm').textContent='ได้รับกอดแล้วจ้า 🤗💙'};$('again').onclick=()=>{$('gift').textContent='🎁';if(window.musicPlayer)window.musicPlayer.pause();go(0)};
</script>
</body>
</html>
